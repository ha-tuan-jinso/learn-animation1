<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アニメーションデモ</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:sans-serif;
}

body{
  line-height:1.6;
}

/* ===== section ===== */
.demo-section{
  padding:100px 20px;
}

/* mỗi section màu khác nhau */
.bg1{ background:#f8f8f8; }
.bg2{ background:#eaf6ff; }
.bg3{ background:#fff5f5; }
.bg4{ background:#f3fff5; }
.bg5{ background:#f9f0ff; }

/* ===== layout ===== */
.demo-item{
  max-width:1200px;
  margin:0 auto;
  display:flex;
  align-items:center;
  gap:60px;
}

.reverse{
  flex-direction:row-reverse;
}

.demo-img,
.demo-text{
  flex:1;
}

.demo-img{
  overflow:hidden;
  border-radius:12px;
}

.demo-img img{
  width:100%;
  display:block;
  transition: transform 0.4s ease, filter 0.4s ease;
}

/* ===== text ===== */
.demo-text h3{
  font-size:28px;
  margin-bottom:16px;
}

.demo-text p{
  color:#555;
}

/* ===== scroll ===== */
.fade-up{
  opacity:0;
  transform:translateY(40px);
  transition:0.6s ease;
}

.fade-up.show{
  opacity:1;
  transform:translateY(0);
}

/* ===== animations ===== */

/* 1 */
.float img{
  animation: float 4s ease-in-out infinite;
}
@keyframes float{
  0%{ transform:translateY(0); }
  50%{ transform:translateY(-10px); }
  100%{ transform:translateY(0); }
}

/* 2 */
.zoom img{
  animation: zoom 4s ease-in-out infinite;
}
@keyframes zoom{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.08); }
  100%{ transform:scale(1); }
}

/* 3 */
.rotate img{
  animation: rotate 5s ease-in-out infinite;
}
@keyframes rotate{
  0%{ transform:rotate(0); }
  50%{ transform:rotate(3deg); }
  100%{ transform:rotate(0); }
}

/* 4 */
.blur img{
  animation: blur 3s ease-in-out infinite alternate;
}
@keyframes blur{
  from{ filter:blur(3px); }
  to{ filter:blur(0); }
}

/* 5 */
.gray img{
  animation: gray 4s ease-in-out infinite alternate;
}
@keyframes gray{
  from{ filter:grayscale(100%); }
  to{ filter:grayscale(0); }
}

/* hover */
.demo-img:hover img{
  transform: scale(1.1) translateY(-8px);
}

/* mobile */
@media (max-width:768px){
  .demo-item{
    flex-direction:column;
    gap:20px;
  }

  .fade-up{
    opacity:1;
    transform:none;
  }

  .demo-img img{
    animation:none;
  }
}
</style>
</head>

<body>

<!-- 1 -->
<section class="demo-section bg1">
  <div class="demo-item fade-up float">
    <div class="demo-img">
      <img src="https://picsum.photos/600/400?1">
    </div>
    <div class="demo-text">
      <h3>フロートアニメーション</h3>
      <p>画像が上下にゆっくり動くアニメーションです。</p>
    </div>
  </div>
</section>

<!-- 2 -->
<section class="demo-section bg2">
  <div class="demo-item reverse fade-up zoom">
    <div class="demo-img">
      <img src="https://picsum.photos/600/400?2">
    </div>
    <div class="demo-text">
      <h3>ズームアニメーション</h3>
      <p>画像が拡大・縮小を繰り返します。</p>
    </div>
  </div>
</section>

<!-- 3 -->
<section class="demo-section bg3">
  <div class="demo-item fade-up rotate">
    <div class="demo-img">
      <img src="https://picsum.photos/600/400?3">
    </div>
    <div class="demo-text">
      <h3>回転アニメーション</h3>
      <p>画像が軽く回転して動きを出します。</p>
    </div>
  </div>
</section>

<!-- 4 -->
<section class="demo-section bg4">
  <div class="demo-item reverse fade-up blur">
    <div class="demo-img">
      <img src="https://picsum.photos/600/400?4">
    </div>
    <div class="demo-text">
      <h3>ブラーアニメーション</h3>
      <p>ぼかしからクリアへ変化する表現です。</p>
    </div>
  </div>
</section>

<!-- 5 -->
<section class="demo-section bg5">
  <div class="demo-item fade-up gray">
    <div class="demo-img">
      <img src="https://picsum.photos/600/400?5">
    </div>
    <div class="demo-text">
      <h3>グレースケール</h3>
      <p>白黒からカラーへ変わるアニメーションです。</p>
    </div>
  </div>
</section>

<script>
if (window.matchMedia('(min-width:769px)').matches){
  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('show')
      }
    })
  },{
    threshold:0.3
  })

  document.querySelectorAll('.fade-up')
    .forEach(el => observer.observe(el))
}
</script>

</body>
</html>
